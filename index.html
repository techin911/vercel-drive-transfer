<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveTransfer — Upload Files to Google Drive</title>
  <meta name="description" content="Fast, simple file uploader to Google Drive with progress and file size tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>DriveTransfer</h1>
          <p>Upload Files → Google Drive</p>
        </div>
      </div>
      <div class="header-right">
        <button id="btnSignIn" class="btn-signin" onclick="signIn()">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          Connect Google Drive
        </button>
        <div id="statusDot" class="status-dot" title="Status"></div>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main-grid">
      <!-- Upload Panel -->
      <section class="card upload-card">
        <div class="card-header">
          <span class="card-title">📁 File Upload</span>
          <span id="uploadStatusBadge" class="badge badge-ready">Ready</span>
        </div>

        <!-- Dropzone -->
        <div id="dropzone" class="dropzone" onclick="onDropzoneClick()">
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(event)">
          <div class="dropzone-inner">
            <div class="dropzone-icon" id="dzIcon">
              <svg viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="30" stroke="url(#g1)" stroke-width="2" stroke-dasharray="6 3"/>
                <defs>
                  <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#00f2fe"/>
                    <stop offset="1" stop-color="#9d4edd"/>
                  </linearGradient>
                </defs>
                <path d="M32 20v16M24 28l8-8 8 8" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M22 42h20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <h3 class="dz-title">Drag & Drop Files Here</h3>
            <p class="dz-sub">Click to select file &bull; Any size supported</p>
            <div class="dz-btn">Choose Files</div>
          </div>
        </div>

        <!-- Progress Section -->
        <div id="progressSection" class="progress-section hidden">
          <div class="progress-info">
            <span id="progressFileName" class="progress-name">file.zip</span>
            <span id="progressPct" class="progress-pct">0%</span>
          </div>
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div class="progress-stats">
            <span id="progressUploaded">0 B / 0 B</span>
            <span id="progressSpeed">— MB/s</span>
            <span id="progressEta">ETA: —</span>
          </div>
          <button id="btnCancel" class="btn-cancel" onclick="cancelUpload()">✕ Cancel</button>
        </div>

        <!-- Upload Result -->
        <div id="uploadResult" class="upload-result hidden"></div>
      </section>

      <!-- Files Panel -->
      <aside class="card files-card">
        <div class="card-header">
          <span class="card-title">☁️ Uploaded Files</span>
          <button class="icon-btn-sm" onclick="clearAllFiles()" title="Clear history">🗑️</button>
        </div>
        <div id="filesList" class="files-list">
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <p>No files uploaded yet.</p>
            <p class="empty-sub">Completed files and their size will appear here.</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
